<!DOCTYPE html>
<html lang="nn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index, follow">
    <title>Endringar — Vyrdepil</title>
    <link rel="icon" type="image/png" href="/_resources/vyrdepil-design/vyrde.png" sizes="any">
    <link rel="apple-touch-icon" href="/_resources/vyrdepil-design/vyrde.png">
<link rel="stylesheet" href="css/vyrdepil-design.css?v=1.4">
    <link rel="stylesheet" href="css/endringar.css?v=1">
    <script src="js/vyrdepil-icons.js" defer></script>
    <script src="js/vyrdepil-util.js?v=1.2" defer></script>
    <script src="js/vyrdepil-design.js?v=1.1" defer></script>
    <script src="js/vyrdepil-app-shell.js?v=7" defer></script>
    <script src="js/vyrdepil-menu.js?v=2" defer></script>
    <script src="js/endringar.js?v=2" defer></script>
  <script src="js/vyrdepil-footer.js?v=2" defer></script>
</head>
<body class="vp-page" data-vp-design data-vp-site-page="true" data-vp-site-footer>
<main id="main" class="vp-shell vp-site-main vp-policy-page vp-changelog-page">
    <header class="vp-panel vp-panel--plain vp-policy-title-card">
        <h1 class="vp-title">Endringar</h1>
        <p class="vp-prose">Kort oppsummering av kvart punkt i endringsloggen, nyaste øvst. Den fulle loggen med grunngjevingar og målingar ligg i <code>CHANGELOG.md</code> i kjeldekoden.</p>
    </header>

    <section class="vp-panel vp-panel--plain vp-changelog-controls" aria-label="Filtrer endringsloggen">
        <div class="vp-actions vp-changelog-filter" id="endrFilter" role="group" aria-label="Vis berre">
            <button type="button" class="vp-button vp-button--quiet vp-button--compact" data-filter="alle" aria-pressed="true">Alt</button>
            <button type="button" class="vp-button vp-button--quiet vp-button--compact" data-filter="verktoy" aria-pressed="false">Nye verktøy</button>
            <button type="button" class="vp-button vp-button--quiet vp-button--compact" data-filter="eksperiment" aria-pressed="false">Eksperiment</button>
            <button type="button" class="vp-button vp-button--quiet vp-button--compact" data-filter="nytt" aria-pressed="false">Nytt</button>
            <button type="button" class="vp-button vp-button--quiet vp-button--compact" data-filter="endra" aria-pressed="false">Endra</button>
            <button type="button" class="vp-button vp-button--quiet vp-button--compact" data-filter="fiksa" aria-pressed="false">Fiksa</button>
        </div>
        <p class="vp-small vp-changelog-count" id="endrTal" aria-live="polite"></p>
    </section>

    <div class="vp-changelog-list" id="endrListe"></div>
</main>

</body>
</html>
