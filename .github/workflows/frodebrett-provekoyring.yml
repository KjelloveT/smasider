name: Frødebrett · Prøvekøyring før merge

on:
  push:
    branches: [feat/frodebrett-provekoyring]

permissions:
  contents: read

jobs:
  gmail:
    name: Sjekk Gmail-innlogginga
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Stadfest SMTP-innlogging med NOOP
        env:
          MAIL_FROM: ${{ secrets.FRODEBRETT_GMAIL_USER || secrets.FRODEBRETT_MAIL_TO }}
          MAIL_PASSWORD: ${{ secrets.FRODEBRETT_GMAIL_APP_PASSWORD }}
        run: |
          if [ -z "$MAIL_FROM" ] || [ -z "$MAIL_PASSWORD" ]; then
            echo "::error::Gmail-innlogginga manglar ei opplysning."
            exit 1
          fi
          sender=$(printf '%s' "$MAIL_FROM" | tr -d '[:space:]')
          app_password=$(printf '%s' "$MAIL_PASSWORD" | tr -d '[:space:]')
          echo "::add-mask::$sender"
          echo "::add-mask::$app_password"
          if [ "${#app_password}" -ne 16 ]; then
            echo "::error::Gmail-app-passordet har feil format etter fjerning av mellomrom."
            exit 1
          fi
          if [ "$app_password" = "$MAIL_PASSWORD" ] && [ "$sender" = "$MAIL_FROM" ]; then
            echo "Innloggingsverdiane hadde ingen skiljemellomrom."
          else
            echo "Fjerna skiljemellomrom i innloggingsverdiane."
          fi
          if status=$(curl --silent --show-error --max-time 30 --ssl-reqd --request NOOP --output /dev/null --write-out '%{response_code}' \
            --url 'smtps://smtp.gmail.com:465' --user "$sender:$app_password"); then
            echo "SMTP-innlogginga er godkjend."
          else
            echo "::error::Gmail avviste innlogginga med SMTP-status $status."
            exit 1
          fi
