name: Frødebrett · Vis den andre prøvefrøda i Azure

on:
  push:
    branches: [feat/frodebrett-provevising]

jobs:
  build_and_deploy_job:
    if: github.ref_name == 'feat/frodebrett-provevising'
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
       id-token: write
       contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          ref: e0b6d278bbab02ef0097f69426f5b0d7c7b4ecb4
          submodules: true
          lfs: false
      - name: Install OIDC Client from Core Package
        run: npm install @actions/core@1.6.0 @actions/http-client
      - name: Get Id Token
        uses: actions/github-script@v6
        id: idtoken
        with:
           script: |
               const coredemo = require('@actions/core')
               return await coredemo.getIDToken()
           result-encoding: string
      - name: Prepare static site content
        run: |
          mkdir -p _deploy-content
          git archive HEAD | tar -x -C _deploy-content

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_RED_GLACIER_059594203 }}
          action: "upload"
          production_branch: feat/frodebrett-provevising
          app_location: "./_deploy-content"
          api_location: ""
          output_location: ""
          skip_app_build: true
          github_id_token: ${{ steps.idtoken.outputs.result }}
